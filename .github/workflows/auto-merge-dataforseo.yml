name: Auto Merge DataForSEO Configs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Security and Scope Verification
        id: security_check
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "PR Author: $PR_AUTHOR"

          # 1. Author Whitelist Check
          TRUSTED_USERS="dataforseo"

          IS_TRUSTED=0
          for user in $TRUSTED_USERS; do
            if [ "$PR_AUTHOR" == "$user" ]; then
              IS_TRUSTED=1
              break
            fi
          done

          if [ $IS_TRUSTED -eq 0 ]; then
            echo "::warning::Author '$PR_AUTHOR' is not in the trusted list. Skipping auto-merge (manual review required)."
            echo "should_merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. File Path and Scope Verification
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          echo "=== Changed Files ==="
          echo "$CHANGED_FILES"
          echo "====================="

          NEEDS_MANUAL_REVIEW=0

          for file in $CHANGED_FILES; do
            # Policy A: base.json changes require manual review
            if [ "$file" == "dataforseo/base.json" ]; then
              echo "::warning file=dataforseo/base.json::Core architecture file 'dataforseo/base.json' modified. Requiring manual review."
              NEEDS_MANUAL_REVIEW=1
            fi

            # Policy B: Strictly reject changes outside dataforseo/
            if [[ "$file" != dataforseo/* ]]; then
              echo "::error::File '$file' is outside the permitted 'dataforseo/' directory. Rejecting."
              exit 1
            fi
          done

          if [ $NEEDS_MANUAL_REVIEW -eq 1 ]; then
            echo "should_merge=false" >> $GITHUB_OUTPUT
            echo "requires_manual_approval=true" >> $GITHUB_OUTPUT
          else
            echo "Verification passed: Changes are confined to 'dataforseo/' and 'base.json' is untouched."
            echo "should_merge=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify Manual Review Needed
        if: steps.security_check.outputs.requires_manual_approval == 'true'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ Modifications to core architecture file \`dataforseo/base.json\` detected. Auto-merge is paused; manual review from the maintainer is required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and Auto-Merge PR
        if: steps.security_check.outputs.should_merge == 'true'
        run: |
          gh pr review "$PR_URL" --approve --body "Automated review: Configuration verified. Changes confined to 'dataforseo/' directory. Auto-merging."
          gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
