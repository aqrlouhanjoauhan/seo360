name: Publish SEO360 MCP to npm

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Publish to npm (skip if version unchanged)
        uses: JS-DevTools/npm-publish@v4
        with:
          package: ./mcp/package.json
          strategy: upgrade
          access: public
